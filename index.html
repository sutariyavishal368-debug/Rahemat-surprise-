<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Rahemat ❤️</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  overflow:hidden;
  font-family:Arial,sans-serif;
  background:#fff4f7;
}

#app{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
  background:linear-gradient(180deg,#fff8fa,#ffeef4);
}

.screen{
  position:absolute;
  inset:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  transition:opacity 1s ease,transform 1s ease;
}

.hidden{
  opacity:0;
  pointer-events:none;
  transform:scale(1.08);
}

/* START */
#start h1{
  color:#d84b75;
  font-size:clamp(28px,8vw,46px);
  margin-bottom:25px;
}

.heart{
  font-size:90px;
  animation:beat 1.2s infinite;
  filter:drop-shadow(0 0 18px #ff8fab);
}

#play{
  margin-top:35px;
  border:0;
  padding:15px 38px;
  border-radius:40px;
  background:#e95b82;
  color:white;
  font-size:20px;
  font-weight:bold;
  box-shadow:0 8px 25px #e95b8266;
  cursor:pointer;
}

/* GAME */
#game{
  justify-content:flex-start;
}

.game-title{
  margin-top:60px;
  color:#c94770;
  font-size:25px;
}

#target{
  position:absolute;
  right:28px;
  top:45%;
  width:75px;
  height:75px;
  border:3px dashed #ed6d91;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
}

#arrow{
  position:absolute;
  left:30px;
  bottom:80px;
  font-size:55px;
  touch-action:none;
  user-select:none;
  cursor:grab;
}

/* BIRTHDAY */
#birthday{
  justify-content:flex-start;
}

.message{
  position:absolute;
  top:45px;
  text-align:center;
  z-index:10;
}

.message h1{
  color:#d83e6c;
  font-size:clamp(35px,10vw,58px);
  animation:appear 2s ease forwards;
}

.message p{
  margin-top:10px;
  color:#9c5269;
  font-size:20px;
}

/* TREE */
.tree{
  position:absolute;
  width:90vw;
  max-width:430px;
  height:70vh;
  bottom:0;
}

/* trunk */
.trunk{
  position:absolute;
  bottom:-20px;
  left:50%;
  width:38px;
  height:48%;
  transform:translateX(-50%);
  background:linear-gradient(90deg,#71442b,#a86b45,#704229);
  border-radius:20px 20px 8px 8px;
}

/* heart branches */
.branch{
  position:absolute;
  width:10px;
  height:230px;
  background:#805033;
  border-radius:10px;
  bottom:35%;
  left:50%;
  transform-origin:bottom center;
}

.b1{transform:rotate(-48deg)}
.b2{transform:rotate(48deg)}
.b3{transform:rotate(-27deg);height:260px}
.b4{transform:rotate(27deg);height:260px}
.b5{transform:rotate(-8deg);height:220px}
.b6{transform:rotate(8deg);height:220px}

.flower{
  position:absolute;
  font-size:25px;
  opacity:0;
  animation:flowerIn .8s ease forwards;
}

.f1{left:17%;top:27%;animation-delay:.2s}
.f2{left:29%;top:18%;animation-delay:.4s}
.f3{left:42%;top:10%;animation-delay:.6s}
.f4{left:54%;top:10%;animation-delay:.8s}
.f5{left:67%;top:18%;animation-delay:1s}
.f6{left:78%;top:29%;animation-delay:1.2s}
.f7{left:25%;top:37%;animation-delay:1.4s}
.f8{left:40%;top:30%;animation-delay:1.6s}
.f9{left:57%;top:30%;animation-delay:1.8s}
.f10{left:70%;top:38%;animation-delay:2s}
.f11{left:34%;top:48%;animation-delay:2.2s}
.f12{left:52%;top:46%;animation-delay:2.4s}
.f13{left:63%;top:50%;animation-delay:2.6s}

/* particles */
.particle{
  position:absolute;
  left:50%;
  top:45%;
  font-size:22px;
  animation:burst 1.2s ease-out forwards;
  pointer-events:none;
}

@keyframes beat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.18)}
}

@keyframes appear{
  from{opacity:0;transform:translateY(30px) scale(.8)}
  to{opacity:1;transform:translateY(0) scale(1)}
}

@keyframes flowerIn{
  from{opacity:0;transform:scale(0)}
  to{opacity:1;transform:scale(1)}
}
